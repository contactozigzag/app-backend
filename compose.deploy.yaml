    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_webhooks_green
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async_webhooks", "--time-limit=3600", "--memory-limit=64M", "-vv"]
    healthcheck:
