---
# Blue/Green production deployment overlay
#
# Usage: docker compose -f compose.yaml -f compose.deploy.yaml --env-file .env.prod --profile infra --profile <blue|green> up -d
#
# Profiles:
#   infra  — shared stateful services (database, rabbitmq, redis, opensearch, traefik, fluent-bit, alloy)
#   blue   — blue slot application services (php-blue, workers)
#   green  — green slot application services (php-green, workers)
#
# Traefik routing is controlled by the file provider watching traefik/dynamic/routing.yaml.
# The deploy script (scripts/deploy.sh) writes the active slot to that file.
#
# Required env vars in .env.prod for observability (Grafana Cloud):
#   GRAFANA_CLOUD_LOKI_HOST=logs-prod-XXX.grafana.net  (hostname only, no https://)
#   GRAFANA_CLOUD_LOKI_USER=123456
#   GRAFANA_CLOUD_API_KEY=glc_xxxxxxxxxxxxx
#   GRAFANA_CLOUD_OTLP_ENDPOINT=https://otlp-gateway-prod-us-east-0.grafana.net/otlp
#   GRAFANA_CLOUD_INSTANCE_ID=123456

services:
  # ══════════════════════════════════════════════════════════════════════════
  # Shared Infrastructure (profile: infra)
  # ══════════════════════════════════════════════════════════════════════════

  traefik:
    profiles: [infra]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.forwardedHeaders.insecure=true
      - --entrypoints.web.forwardedHeaders.insecure=true
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  database:
    profiles: [infra]
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --innodb_rollback_on_timeout=ON
      - --innodb-buffer-pool-size=128M
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  rabbitmq:
    profiles: [infra]
    restart: unless-stopped
    labels:
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  redis:
    profiles: [infra]
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  opensearch:
    profiles: [infra]
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
    labels:
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  opensearch-dashboards:
    profiles: [infra]
    restart: unless-stopped
    labels:
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  fluent-bit:
    profiles: [infra]
    image: fluent/fluent-bit:4.0
    container_name: zigzag_fluent_bit
    restart: unless-stopped
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
      - fluent_bit_cache:/fluent-bit/cache
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:2020:2020"
    environment:
      GRAFANA_CLOUD_LOKI_HOST: ${GRAFANA_CLOUD_LOKI_HOST}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Grafana Alloy: OTLP collector for traces & metrics ─────────────────────
  alloy:
    profiles: [infra]
    image: grafana/alloy:latest
    container_name: zigzag_alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:12345:12345" # Alloy debug UI
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    deploy:
      resources:
        limits:
          memory: 64M

  # ══════════════════════════════════════════════════════════════════════════
  # Blue Slot (profile: blue)
  # ══════════════════════════════════════════════════════════════════════════

  php-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_php_blue
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    volumes:
      - ./config/jwt:/app/config/jwt:rw,cached
      - caddy_data_blue:/data
      - caddy_config_blue:/config
    env_file: .env.prod
    environment:
      FRANKENPHP_WORKER_CONFIG: "num 4"
      SERVER_NAME: ":80"
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_URL: http://php-blue:80/.well-known/mercure
      MERCURE_PUBLIC_URL: https://${PUBLIC_DOMAIN:-localhost}/.well-known/mercure
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-passwd}@database:3306/${MYSQL_DATABASE:-db}?serverVersion=${MYSQL_VERSION:-8}&charset=${MYSQL_CHARSET:-utf8mb4}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_FRONTEND_API_KEY: ${GOOGLE_MAPS_FRONTEND_API_KEY:-}
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: "${JWT_PASSPHRASE}"
      TRUSTED_PROXIES: "REMOTE_ADDR"
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: "zigzag-api"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod,service.version=${APP_VERSION:-1.0.0}"
      OTEL_PHP_EXCLUDED_URLS: "health,health/ready,health/live,_profiler,_wdt"
    depends_on:
      database:
        condition: service_healthy
      alloy:
        condition: service_started
    labels:
      # Routing is handled by Traefik file provider, not Docker labels
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"

  messenger_worker-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_blue
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=128M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      SERVER_NAME: ":80"
      APP_SECRET: ${APP_SECRET}
      APP_ENV: prod
      DATABASE_URL: mysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-passwd}@database:3306/${MYSQL_DATABASE:-db}?serverVersion=${MYSQL_VERSION:-8}&charset=${MYSQL_CHARSET:-utf8mb4}
      RABBITMQ_DSN: ${RABBITMQ_DSN:-phpamqplib://guest:guest@rabbitmq:5672/%2f}
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: "zigzag-worker-async"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod,service.version=${APP_VERSION:-1.0.0}"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"

  messenger_worker_webhooks-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_webhooks_blue
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async_webhooks", "--time-limit=3600", "--memory-limit=64M", "-vv"]
