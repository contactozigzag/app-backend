        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"

  # ══════════════════════════════════════════════════════════════════════════
  # Override base compose.yaml services that are NOT used in deploy mode
  # ══════════════════════════════════════════════════════════════════════════

  # The base php service from compose.yaml is not used — blue/green slots replace it
  php:
    profiles: [disabled]

  # Base worker services from compose.yaml are not used — blue/green slots replace them
  messenger_worker:
    profiles: [disabled]

  messenger_worker_webhooks:
    profiles: [disabled]

  messenger_worker_tracking:
    profiles: [disabled]

volumes:
  caddy_data_blue:
  caddy_config_blue:
  caddy_data_green:
  caddy_config_green:
