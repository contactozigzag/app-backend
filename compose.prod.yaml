---
# Production + Blue/Green deployment overlay
#
# Usage: docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.prod --profile infra --profile <blue|green> up -d
#
# Profiles:
#   infra  — shared stateful services (database, rabbitmq, redis, opensearch, fluent-bit, alloy)
#   blue   — blue slot application services (php-blue, workers)
#   green  — green slot application services (php-green, workers)
#
# Caddy's admin API is used by the deploy script to switch routing between slots.
# See scripts/deploy.sh for the full deployment flow.
#
# Required env vars in .env.prod for observability (Grafana Cloud):
#   GRAFANA_CLOUD_LOKI_HOST=logs-prod-XXX.grafana.net  (hostname only, no https://)
#   GRAFANA_CLOUD_LOKI_USER=123456
#   GRAFANA_CLOUD_API_KEY=glc_xxxxxxxxxxxxx
#   GRAFANA_CLOUD_OTLP_ENDPOINT=https://otlp-gateway-prod-us-east-0.grafana.net/otlp
#   GRAFANA_CLOUD_INSTANCE_ID=123456

# ── Shared OTEL env block (YAML anchor) ────────────────────────────────────
x-otel-env: &otel-env
  OTEL_PHP_AUTOLOAD_ENABLED: "true"
  OTEL_PHP_DISABLED_INSTRUMENTATIONS: ""
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod,service.version=${APP_VERSION:-1.0.0}"
  OTEL_PHP_EXCLUDED_URLS: "health,health/ready,health/live,_profiler,_wdt"

# ── Shared logging block (YAML anchor) ─────────────────────────────────────
x-logging: &prod-logging
  driver: fluentd
  options:
    fluentd-address: "localhost:24224"
    fluentd-async: "true"
    fluentd-retry-wait: "1s"
    fluentd-max-retries: "30"
    tag: "docker.{{.Name}}"

# ── Shared worker env block (YAML anchor) ──────────────────────────────────
x-worker-env: &worker-env
  SERVER_NAME: ${PUBLIC_DOMAIN:-localhost}
  APP_SECRET: ${APP_SECRET}
  APP_ENV: prod
  DEFAULT_URI: https://${PUBLIC_DOMAIN:-localhost}
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
  RABBITMQ_DSN: ${RABBITMQ_DSN:-phpamqplib://guest:guest@rabbitmq:5672/%2f}

# ── Shared php-slot env block (YAML anchor) ────────────────────────────────
x-php-slot-env: &php-slot-env
  FRANKENPHP_WORKER_CONFIG: "num 4 max_threads 16"
  SERVER_NAME: ${PUBLIC_DOMAIN:-localhost}
  CADDY_TLS_CONFIG: "/certs/origin.pem /certs/origin-key.pem"
  APP_SECRET: ${APP_SECRET}
  DEFAULT_URI: https://${PUBLIC_DOMAIN:-localhost}
  MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
  MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
  MERCURE_PUBLIC_URL: https://${PUBLIC_DOMAIN:-localhost}/.well-known/mercure
  MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET}
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  GOOGLE_MAPS_FRONTEND_API_KEY: ${GOOGLE_MAPS_FRONTEND_API_KEY:-}
  JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
  JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
  JWT_PASSPHRASE: "${JWT_PASSPHRASE}"
  # Cloudflare is the only reverse proxy — trust its X-Forwarded-* headers
  TRUSTED_PROXIES: "REMOTE_ADDR"

services:
  # ══════════════════════════════════════════════════════════════════════════
  # Shared Infrastructure (profile: infra)
  # ══════════════════════════════════════════════════════════════════════════

  database:
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    command:
      # PostgreSQL production tuning (adjust for your VPS RAM)
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_connections=100
    logging: *prod-logging

  rabbitmq:
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    logging: *prod-logging

  redis:
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    logging: *prod-logging

  opensearch:
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
    logging: *prod-logging

  opensearch-dashboards:
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5601:5601"
    logging: *prod-logging

  fluent-bit:
    profiles: [infra]
    image: fluent/fluent-bit:4.0
    container_name: zigzag_fluent_bit
    restart: unless-stopped
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
      - fluent_bit_cache:/fluent-bit/cache
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:2020:2020"
    environment:
      GRAFANA_CLOUD_LOKI_HOST: ${GRAFANA_CLOUD_LOKI_HOST}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Grafana Alloy: OTLP collector for traces & metrics ─────────────────────
  alloy:
    profiles: [infra]
    image: grafana/alloy:latest
    container_name: zigzag_alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:12345:12345" # Alloy debug UI
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    deploy:
      resources:
        limits:
          memory: 64M

  # ══════════════════════════════════════════════════════════════════════════
  # Blue Slot (profile: blue)
  # ══════════════════════════════════════════════════════════════════════════

  php-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_php_blue
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
      - target: 443
        published: ${HTTPS_PORT:-443}
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    volumes:
      - ./config/jwt:/app/config/jwt:rw,cached
      - ./frankenphp/certs:/certs:ro
      - caddy_data_blue:/data
      - caddy_config_blue:/config
    env_file: .env.prod
    environment:
      <<: [*php-slot-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-api"
      MERCURE_URL: http://php-blue:80/.well-known/mercure
    depends_on:
      database:
        condition: service_healthy
      alloy:
        condition: service_started
    logging: *prod-logging

  messenger_worker-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_blue
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=128M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      <<: [*worker-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-worker-async"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging: *prod-logging

  messenger_worker_webhooks-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_webhooks_blue
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async_webhooks", "--time-limit=3600", "--memory-limit=64M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      <<: [*worker-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-worker-webhooks"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging: *prod-logging

  messenger_worker_tracking-blue:
    profiles: [blue]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_tracking_blue
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async_tracking", "--time-limit=3600", "--memory-limit=64M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      <<: [*worker-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-worker-tracking"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging: *prod-logging

  # ══════════════════════════════════════════════════════════════════════════
  # Green Slot (profile: green)
  # ══════════════════════════════════════════════════════════════════════════

  php-green:
    profiles: [green]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_php_green
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
      - target: 443
        published: ${HTTPS_PORT:-443}
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    volumes:
      - ./config/jwt:/app/config/jwt:rw,cached
      - ./frankenphp/certs:/certs:ro
      - caddy_data_green:/data
      - caddy_config_green:/config
    env_file: .env.prod
    environment:
      <<: [*php-slot-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-api"
      MERCURE_URL: http://php-green:80/.well-known/mercure
    depends_on:
      database:
        condition: service_healthy
      alloy:
        condition: service_started
    logging: *prod-logging

  messenger_worker-green:
    profiles: [green]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_green
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=128M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      <<: [*worker-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-worker-async"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging: *prod-logging

  messenger_worker_webhooks-green:
    profiles: [green]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_webhooks_green
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async_webhooks", "--time-limit=3600", "--memory-limit=64M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      <<: [*worker-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-worker-webhooks"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging: *prod-logging

  messenger_worker_tracking-green:
    profiles: [green]
    image: ${IMAGES_PREFIX:-}app-php:${DEPLOY_TAG:-latest}
    container_name: zigzag_messenger_worker_tracking_green
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async_tracking", "--time-limit=3600", "--memory-limit=64M", "-vv"]
    healthcheck:
      disable: true
    env_file: .env.prod
    environment:
      <<: [*worker-env, *otel-env]
      OTEL_SERVICE_NAME: "zigzag-worker-tracking"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging: *prod-logging

  # ══════════════════════════════════════════════════════════════════════════
  # Override base compose.yaml services that are NOT used in deploy mode
  # ══════════════════════════════════════════════════════════════════════════

  # The base php service from compose.yaml is not used — blue/green slots replace it
  php:
    profiles: [disabled]

  # Base worker services from compose.yaml are not used — blue/green slots replace them
  messenger_worker:
    profiles: [disabled]

  messenger_worker_webhooks:
    profiles: [disabled]

  messenger_worker_tracking:
    profiles: [disabled]

volumes:
  caddy_data_blue:
  caddy_config_blue:
  caddy_data_green:
  caddy_config_green:
  fluent_bit_cache:
