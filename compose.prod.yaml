---
# Production environment override
services:
  traefik:
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ACME Let's Encrypt — TLS termination at Traefik
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Dashboard is NOT exposed in production
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    volumes:
      - ./config/jwt:/app/config/jwt:rw,cached
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_PUBLIC_URL: https://${TRAEFIK_DOMAIN}/.well-known/mercure
    labels:
      # Production: enable HTTPS entrypoint with Let's Encrypt
      - traefik.http.routers.zigzag-app.entrypoints=web,websecure
      - traefik.http.routers.zigzag-app.tls.certresolver=letsencrypt
      # HTTP→HTTPS redirect middleware
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      - traefik.http.routers.zigzag-app-http.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.zigzag-app-http.entrypoints=web
      - traefik.http.routers.zigzag-app-http.middlewares=redirect-to-https
      # Mercure router also needs websecure entrypoint in prod
      - traefik.http.routers.zigzag-mercure.entrypoints=web,websecure
      - traefik.http.routers.zigzag-mercure.tls.certresolver=letsencrypt
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"

  database:
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --innodb_rollback_on_timeout=ON
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  rabbitmq:
    restart: unless-stopped
    labels:
      # RabbitMQ management dashboard is NOT exposed in production —
      # it contains sensitive operational data and should only be accessed
      # via SSH tunnel or VPN in prod environments
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  redis:
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  opensearch:
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    labels:
      # OpenSearch REST API is NOT exposed in production —
      # the Symfony app accesses it internally via Docker networking (http://opensearch:9200).
      # Direct external access would bypass application-level auth.
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  opensearch-dashboards:
    restart: unless-stopped
    labels:
      # Dashboards NOT exposed in production — access via SSH tunnel or VPN only
      - traefik.enable=false
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.{{.Name}}"

  fluent-bit:
    image: fluent/fluent-bit:4.0
    container_name: zigzag_fluent_bit
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:2020:2020"
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      APP_ENV: prod
    restart: unless-stopped

  # Messenger worker services — production overrides
  #
  # Workers use the same prod image target as the php service.
  # Logging mirrors the php service configuration: fluentd-async ensures
  # worker logs are buffered and not lost if fluent-bit restarts briefly.
  # fluentd-retry-wait and fluentd-max-retries are included because workers
  # are long-running processes that need the same delivery guarantees as php.

  messenger_worker:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      APP_ENV: prod
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"

  messenger_worker_webhooks:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      APP_ENV: prod
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"

  messenger_worker_tracking:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      APP_ENV: prod
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"
