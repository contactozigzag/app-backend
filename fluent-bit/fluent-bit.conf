# ============================================================================
# Fluent Bit Configuration — Grafana Cloud (Loki)
# Replaces New Relic output with Grafana Cloud Loki
#
# Required env vars (set in compose or .env.prod):
#   GRAFANA_CLOUD_LOKI_USER    — Your Grafana Cloud Loki user ID (numeric)
#   GRAFANA_CLOUD_API_KEY      — A Grafana Cloud API token with MetricsPublisher role
#   GRAFANA_CLOUD_LOKI_HOST    — e.g. logs-prod-006.grafana.net
# ============================================================================

[SERVICE]
    Flush           5
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    # Buffer to disk to prevent log loss during transient network issues
    storage.path              /fluent-bit/cache/
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     128

# ── Input: Docker fluentd driver ─────────────────────────────────────────────
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    storage.type      filesystem
    Tag               docker.*

# ── Filter: Parse JSON log field from Docker containers ──────────────────────
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        docker_json
    Reserve_Data  On
    Preserve_Key  On

# ── Filter: Add hostname for context ─────────────────────────────────────────
[FILTER]
    Name          modify
    Match         docker.*
    Add           hostname zigzag-nyc
    Add           env prod

# ── Output: Grafana Cloud Loki ───────────────────────────────────────────────
[OUTPUT]
    Name              loki
    Match             docker.*
    Host              ${GRAFANA_CLOUD_LOKI_HOST}
    Port              443
    TLS               On
    TLS.Verify        On
    HTTP_User         ${GRAFANA_CLOUD_LOKI_USER}
    HTTP_Passwd       ${GRAFANA_CLOUD_API_KEY}
    Labels            job=zigzag, env=prod
    Label_Keys        $container_name
    Line_Format       json
    Compress          gzip
    # Retry config for resilience
    Retry_Limit       5

# ── Output (optional): stdout for debugging — remove in stable prod ──────────
# [OUTPUT]
#     Name              stdout
#     Match             docker.*
#     Format            json_lines
