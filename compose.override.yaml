---
# Development environment override — loaded automatically by `docker compose up`
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    restart: "no"
    build:
      context: .
      target: frankenphp_dev
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
      - target: 443
        published: ${HTTPS_PORT:-443}
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    restart: "no"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    restart: "no"
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  rabbitmq:
    restart: "no"
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  redis:
    restart: "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"

  opensearch:
    restart: "no"

  opensearch-dashboards:
    restart: "no"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"

  # Messenger worker services — development overrides
  #
  # Source is bind-mounted so code changes are reflected immediately
  # without rebuilding the image, consistent with the php service behaviour.

  messenger_worker:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
    environment:
      APP_ENV: "${APP_ENV:-dev}"

  messenger_worker_webhooks:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
    environment:
      APP_ENV: "${APP_ENV:-dev}"

  messenger_worker_tracking:
    restart: unless-stopped
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
    environment:
      APP_ENV: "${APP_ENV:-dev}"
