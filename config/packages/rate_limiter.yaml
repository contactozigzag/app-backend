framework:
    rate_limiter:
        payment_api:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'
            cache_pool: 'cache.app'

        gps_ingestion:
            policy: 'fixed_window'
            limit: 1
            interval: '3 seconds'
            cache_pool: 'cache.app'

        driver_search:
            policy: 'sliding_window'
            limit: 30
            interval: '10 seconds'
            cache_pool: 'cache.app'

        school_search:
            policy: 'sliding_window'
            limit: 30
            interval: '10 seconds'
            cache_pool: 'cache.app'

# In dev/test the cache pools are wrapped in TraceableAdapter (debug mode)
# which does not implement StorageInterface. Override to InMemoryStorage so
# lint:container and functional tests can instantiate controllers cleanly.
when@dev:
    services:
        dev.rate_limiter.storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    framework:
        rate_limiter:
            payment_api:
                storage_service: 'dev.rate_limiter.storage'

            gps_ingestion:
                storage_service: 'dev.rate_limiter.storage'

            driver_search:
                storage_service: 'dev.rate_limiter.storage'

            school_search:
                storage_service: 'dev.rate_limiter.storage'

when@test:
    services:
        test.rate_limiter.storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    framework:
        rate_limiter:
            payment_api:
                storage_service: 'test.rate_limiter.storage'

            gps_ingestion:
                storage_service: 'test.rate_limiter.storage'

            driver_search:
                limit: 5
                storage_service: 'test.rate_limiter.storage'

            school_search:
                limit: 5
                storage_service: 'test.rate_limiter.storage'
