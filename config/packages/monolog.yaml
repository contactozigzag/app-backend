monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - security_audit
        - async_pipeline
        - push

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [401, 403, 404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: stderr_json
                # 401/403 are expected client errors. The mobile client already
                # gets a proper JSON body back via API Platform's error provider
                # (status/title/detail). Excluding them here stops fingers_crossed
                # from flushing the whole buffer to stderr as ERROR and logging
                # "Uncaught PHP Exception AccessDeniedHttpException" on every
                # unauthorized request — which is not an uncaught error, the
                # framework handled it and returned 403 to the client.
                excluded_http_codes: [401, 403, 404, 405]
                channels: ["!deprecation", "!security_audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            stderr_json:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
                process_psr_3_messages: false
            security:
                type: stream
                path: php://stderr
                level: info
                channels: [security_audit]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
