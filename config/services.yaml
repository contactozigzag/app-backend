# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MERCADOPAGO_APP_ID): ''
    env(MERCADOPAGO_APP_SECRET): ''
    env(MERCADOPAGO_OAUTH_REDIRECT_URI): ''
    app.driver_route_management_enabled: '%env(bool:DRIVER_ROUTE_MANAGEMENT_ENABLED)%'
    app.distress_proximity_km: '%env(float:DISTRESS_PROXIMITY_KM)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    Monolog\Processor\WebProcessor:
        tags: ['monolog.processor']

    Monolog\Processor\UidProcessor:
        tags: ['monolog.processor']

    App\Service\Logging\CorrelationIdProcessor:
        tags: ['monolog.processor']

    App\Service\Logging\TraceContextProcessor:
        tags: ['monolog.processor']

    # Named logger injections for dedicated channels
    App\EventSubscriber\SecurityAuditSubscriber:
        arguments:
            $securityAuditLogger: '@monolog.logger.security_audit'

    # OpenSearch client
    OpenSearch\Client:
        factory: ['OpenSearch\ClientBuilder', 'fromConfig']
        arguments:
            - hosts: ['%env(OPENSEARCH_URL)%']

    App\Service\OpenSearch\DriverSearchService:
        arguments:
            $indexPrefix: '%env(OPENSEARCH_INDEX_PREFIX)%'

    App\Service\Push\ExpoPushService:
        arguments:
            $expoAccessToken: '%env(EXPO_ACCESS_TOKEN)%'

    App\MessageHandler\SendPushNotificationHandler:
        arguments:
            $logger: '@monolog.logger.push'

    App\MessageHandler\CheckPushReceiptsHandler:
        arguments:
            $logger: '@monolog.logger.push'
